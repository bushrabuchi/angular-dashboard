<mat-toolbar color="primary" class="header-toolbar">
  <button mat-icon-button (click)="onToggleSidebar()">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="app-title">Dashboard</span>

  <span class="spacer"></span>

  <button mat-icon-button matTooltip="Search">
    <mat-icon>search</mat-icon>
  </button>

  <button mat-icon-button matTooltip="Notifications" [matBadge]="5" matBadgeColor="warn">
    <mat-icon>notifications</mat-icon>
  </button>

  <button mat-icon-button [matTooltip]="isDarkMode ? 'Light Mode' : 'Dark Mode'" (click)="toggleTheme()">
    <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button mat-icon-button [matMenuTriggerFor]="userMenu">
    <mat-icon>account_circle</mat-icon>
  </button>

  <mat-menu #userMenu="matMenu">
    <div class="user-info">
      <div class="user-avatar">
        <mat-icon>account_circle</mat-icon>
      </div>
      <div class="user-details">
        <p class="user-name">{{ currentUser?.username }}</p>
        <p class="user-email">{{ currentUser?.email }}</p>
      </div>
    </div>
    <mat-divider></mat-divider>
    <button mat-menu-item routerLink="/settings">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
    <button mat-menu-item>
      <mat-icon>person</mat-icon>
      <span>Profile</span>
    </button>
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="logout()">
      <mat-icon>exit_to_app</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
</mat-toolbar>
